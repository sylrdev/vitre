[package]
name = "sylrdev/vitre"
description = "Developer focused UI library based on Vide."
version = "0.2.0"
license = "MIT"
authors = ["SylrDev <sylrdev@gmail.com>"]
realm = "shared"
registry = "https://github.com/UpliftGames/wally-index"
homepage = "https://sylrdev.github.io/vitre/"
repository = "https://github.com/sylrdev/vitre"
exclude = ["**"]
include = ["src", "src/*", "default.project.json", "wally.lock", "wally.toml"]

[dependencies]
Vide = "sylrdev/vide@0.4.1"
Tailwind = "virtualbutfake/tailwind@0.1.1"
LemonSignal = "data-oriented-house/lemonsignal@2.0.0"

[dev-dependencies]
UILabs = "pepeeltoro41/ui-labs@2.4.2"
